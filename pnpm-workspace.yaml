# nosemgrep: package_managers.pnpm.pnpm-trust-policy.pnpm-trust-policy
packages:
  - "packages/*"

# ─── Cadena de suministro (ver docs/adr/0004-politica-cadena-de-suministro.md) ─
# Solo instala versiones publicadas hace ≥ 24 h. Semgrep recomienda 7 días, pero
# eso bloquea los trenes de parches de Expo/Babel (ADR-0004 explica el trade-off).
# nosemgrep: package_managers.pnpm.pnpm-missing-minimum-release-age.pnpm-minimum-release-age
minimumReleaseAge: 1440
# Bloquea subdependencias desde git/URLs/tarballs arbitrarios.
blockExoticSubdeps: true
# trustPolicy: no-downgrade NO se activa: hoy rechaza @expo/cli y @expo/config-plugins
# (ADR-0004). Revisar en v0.2.
